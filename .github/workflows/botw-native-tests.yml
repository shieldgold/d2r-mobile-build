name: Test BOTW native preparation
on:
  push:
    paths:
      - 'scripts/botw_native/**'
      - 'tests/test_botw*.py'
      - 'native/botw_host/**'
      - 'requirements.botw.txt'
      - 'profiles/botw-*.json'
      - '.github/workflows/botw-native-tests.yml'
  pull_request:
    paths:
      - 'scripts/botw_native/**'
      - 'tests/test_botw*.py'
      - 'native/botw_host/**'
      - 'requirements.botw.txt'
      - 'profiles/botw-*.json'
      - '.github/workflows/botw-native-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts
      BOTW_REWRITER_PATH: .tools/botw-native/e2a0c9a9b5d65f6cd505e967e4760e2745e90ca8/patch_nso.py
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.botw.txt
      - name: Fetch and verify immutable source tool
        run: python -c 'from pathlib import Path; from botw_native.rewrite import fetch_tool; fetch_tool(Path(".tools/botw-native"))'
      - name: Unit tests and synthetic CPU equivalence
        run: python -m unittest discover -s tests -v
