    paths:
      - 'experiments/botw_upstream_backend/**'
      - 'experiments/botw_upstream_host/**'
      - 'experiments/botw_audio_renderer/**'
      - 'tests/test_botw_whole*.py'
      - 'tests/test_botw_upstream_host_policy.py'
      - 'tests/test_botw_upstream_backend_compile.py'
      - 'native/botw_host/**'
      - 'native/botw_app/**'
      - 'native/botw_graphics/**'
      - 'native/botw_input/**'
