      - 'native/botw_audio/**'
      - 'scripts/botw_native/build_ios_shell.py'
      - 'scripts/botw_native/ios.py'
      - 'scripts/botw_native/allocation_guard.py'
      - 'scripts/botw_native/guest_framework.py'
      - 'tests/test_botw_allocation_guard*.py'
      - 'scripts/source/select_xcode.py'
      - 'tests/test_botw_runtime*.py'
