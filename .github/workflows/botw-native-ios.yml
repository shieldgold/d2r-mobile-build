name: Build BOTW generic iOS host
on:
  push:
    paths:
      - 'native/botw_host/**'
      - 'native/botw_app/**'
      - 'native/botw_graphics/**'
      - 'native/botw_input/**'
      - 'native/botw_resources/**'
      - 'native/botw_audio/**'
      - 'scripts/botw_native/build_ios_shell.py'
      - 'scripts/botw_native/ios.py'
      - 'scripts/source/select_xcode.py'
      - 'tests/test_botw_runtime*.py'
      - 'tests/test_botw_kernel.py'
      - 'tests/test_botw_services.py'
      - 'tests/test_botw_application_language.py'
      - 'tests/test_botw_settings_language.py'
      - 'tests/test_botw_storage_buffers.py'
      - 'tests/test_botw_sixaxis*.py'
      - 'tests/test_botw_vibration_services.py'
      - 'tests/test_botw_thread_stack*.py'
      - 'tests/test_botw_input.py'
      - 'tests/test_botw_audio.py'
      - 'tests/test_botw_graphics.py'
      - 'tests/test_botw_linear_texture.py'
      - 'tests/test_botw_storage_class.py'
      - 'tests/test_botw_ios*.py'
      - 'tests/test_botw_logical_heap_policy.py'
      - 'tests/test_botw_event_log.py'
      - 'tests/test_botw_vpool_modules.py'
      - 'tests/test_botw_memory_pool_policy.py'
      - 'tests/test_botw_counter*.py'
      - 'tests/botw_metal_counter_capability.py'
      - 'tests/test_botw_romfs*.py'
      - '.github/workflows/botw-native-ios.yml'
  pull_request:
    paths:
      - 'native/botw_host/**'
      - 'native/botw_app/**'
      - 'native/botw_graphics/**'
      - 'native/botw_input/**'
      - 'native/botw_resources/**'
      - 'native/botw_audio/**'
      - 'scripts/botw_native/build_ios_shell.py'
      - 'scripts/botw_native/ios.py'
      - 'scripts/source/select_xcode.py'
      - 'tests/test_botw_runtime*.py'
      - 'tests/test_botw_kernel.py'
      - 'tests/test_botw_services.py'
      - 'tests/test_botw_application_language.py'
      - 'tests/test_botw_settings_language.py'
      - 'tests/test_botw_storage_buffers.py'
      - 'tests/test_botw_sixaxis*.py'
      - 'tests/test_botw_vibration_services.py'
      - 'tests/test_botw_thread_stack*.py'
      - 'tests/test_botw_input.py'
      - 'tests/test_botw_audio.py'
      - 'tests/test_botw_graphics.py'
      - 'tests/test_botw_linear_texture.py'
      - 'tests/test_botw_storage_class.py'
      - 'tests/test_botw_ios*.py'
      - 'tests/test_botw_logical_heap_policy.py'
      - 'tests/test_botw_event_log.py'
      - 'tests/test_botw_vpool_modules.py'
      - 'tests/test_botw_memory_pool_policy.py'
      - 'tests/test_botw_counter*.py'
      - 'tests/botw_metal_counter_capability.py'
      - 'tests/test_botw_romfs*.py'
      - '.github/workflows/botw-native-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select iPhoneOS SDK
        run: python3 scripts/source/select_xcode.py
      - name: Compile generic shell without game content
        run: python3 -m scripts.botw_native.build_ios_shell --output outputs/botw-ios-shell
      - name: Prepare isolated test dependencies
        run: |
          python3 -m venv .tools/botw-ci-venv
          .tools/botw-ci-venv/bin/python -m pip install -r requirements.botw.txt
      - name: Test native host using synthetic programs
        run: .tools/botw-ci-venv/bin/python -m unittest discover -s tests -p 'test_botw_*.py' -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BOTWNative-generic-ios-host
          path: outputs/botw-ios-shell/BOTWNative-shell.ipa
          if-no-files-found: error
          retention-days: 7
