      - 'tests/test_botw_services.py'
      - 'tests/test_botw_application_language.py'
      - 'tests/test_botw_settings_language.py'
      - 'tests/test_botw_storage_buffers.py'
      - 'tests/test_botw_sixaxis*.py'
      - 'tests/test_botw_vibration_services.py'
      - 'tests/test_botw_thread_stack*.py'
      - 'tests/test_botw_input.py'
      - 'tests/test_botw_audio.py'
      - 'tests/test_botw_graphics.py'
      - 'tests/test_botw_graphics_copy.py'
      - 'tests/test_botw_graphics_lock_observation.py'
      - 'tests/test_botw_mac*.py'
      - 'tests/test_botw_linear_texture.py'
      - 'tests/test_botw_storage_class.py'
