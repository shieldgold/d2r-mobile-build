      - 'tests/test_botw_romfs*.py'
      - '.github/workflows/botw-native-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select iPhoneOS SDK
        run: python3 scripts/source/select_xcode.py
      - name: Compile generic shell without game content
        run: python3 -m scripts.botw_native.build_ios_shell --output outputs/botw-ios-shell
      - name: Compile complete upstream backend for iPhoneOS without execution
        run: python3 experiments/botw_upstream_backend/scripts/build_compile_only.py --sdk iphoneos --output outputs/botw-upstream-iphoneos
      - name: Compile complete upstream host and UIKit frontend without execution
        run: python3 experiments/botw_upstream_host/scripts/build_link_only.py --sdk iphoneos --runtime-configured --output outputs/botw-whole-host-iphoneos
      - name: Preserve complete host iPhoneOS compile receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BOTW-whole-host-iphoneos-compile-receipts
          path: |
            outputs/botw-whole-host-iphoneos/*.json
            outputs/botw-whole-host-iphoneos/*.stdout
            outputs/botw-whole-host-iphoneos/*.stderr
            outputs/botw-whole-host-iphoneos/whole-host-LINK-ONLY-DO-NOT-RUN
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve upstream iPhoneOS compile receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BOTW-upstream-iphoneos-compile-receipts
          path: |
            outputs/botw-upstream-iphoneos/*.json
            outputs/botw-upstream-iphoneos/*.stdout
            outputs/botw-upstream-iphoneos/*.stderr
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare isolated test dependencies
        run: |
          python3 -m venv .tools/botw-ci-venv
          .tools/botw-ci-venv/bin/python -m pip install -r requirements.botw.txt
      - name: Test native host using synthetic programs
        run: .tools/botw-ci-venv/bin/python -m unittest discover -s tests -p 'test_botw_*.py' -v
      - name: Test complete native renderer using owned CPU and AudioUnit fixtures
        env:
          BOTW_AUDIO_RENDERER_SANITIZERS: '1'
        run: .tools/botw-ci-venv/bin/python -m unittest discover -s experiments/botw_audio_renderer/tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BOTWNative-generic-ios-host
          path: outputs/botw-ios-shell/BOTWNative-shell.ipa
          if-no-files-found: error
          retention-days: 7
